<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09111f;
      --panel: rgba(16, 28, 48, 0.88);
      --panel-light: #172944;
      --text: #f3f7ff;
      --muted: #9aacc5;
      --accent: #69a7ff;
      --accent-strong: #367ff0;
      --border: rgba(164, 195, 237, 0.16);
      --success: #56d69a;
      --danger: #ff7f93;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #173968 0, transparent 35%), var(--bg);
    }

    .chat-shell {
      width: min(100%, 860px);
      height: min(760px, calc(100vh - 48px));
      min-height: 520px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(18px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
    }

    h1 { margin: 0 0 5px; font-size: clamp(1.35rem, 3vw, 1.8rem); }
    .subtitle { margin: 0; color: var(--muted); font-size: 0.92rem; }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .connection::before {
      width: 8px;
      height: 8px;
      content: "";
      background: var(--danger);
      border-radius: 50%;
    }

    .connection.online { color: var(--success); }
    .connection.online::before { background: var(--success); box-shadow: 0 0 12px var(--success); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      scroll-behavior: smooth;
    }

    .empty-state { color: var(--muted); text-align: center; padding: 72px 20px; }
    .empty-state strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 1.15rem; }

    .message {
      max-width: 78%;
      margin: 0 0 16px;
      padding: 12px 15px;
      background: var(--panel-light);
      border-radius: 16px 16px 16px 4px;
    }

    .message.mine {
      margin-left: auto;
      background: linear-gradient(135deg, var(--accent-strong), #5a54db);
      border-radius: 16px 16px 4px 16px;
    }

    .message-meta { margin-bottom: 5px; color: #bed2f0; font-size: 0.75rem; }
    .message-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }

    form {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 10px;
      padding: 18px 28px 24px;
      border-top: 1px solid var(--border);
    }

    input, button {
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
    }

    input {
      width: 100%;
      padding: 0 14px;
      color: var(--text);
      background: rgba(5, 13, 26, 0.55);
      outline: none;
    }

    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(105, 167, 255, 0.15); }
    button { padding: 0 20px; color: white; background: var(--accent-strong); border: 0; cursor: pointer; font-weight: 700; }
    button:hover { background: #4c91ff; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }

    @media (max-width: 620px) {
      body { padding: 0; }
      .chat-shell { height: 100vh; min-height: 100vh; border: 0; border-radius: 0; }
      header, #messages { padding-left: 18px; padding-right: 18px; }
      form { grid-template-columns: 1fr auto; padding: 14px 18px 18px; }
      form input[name="username"] { grid-column: 1 / -1; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <main class="chat-shell">
    <header>
      <div>
        <h1>Live chat</h1>
        <p class="subtitle">Messages are shared with everyone connected.</p>
      </div>
      <div id="connectionStatus" class="connection" role="status">Connecting…</div>
    </header>

    <section id="messages" aria-live="polite" aria-label="Chat messages">
      <div id="emptyState" class="empty-state">
        <strong>No messages yet</strong>
        Send the first message to start the conversation.
      </div>
    </section>

    <form id="chatForm">
      <input id="username" name="username" maxlength="24" placeholder="Your name" autocomplete="nickname" required>
      <input id="messageInput" name="message" maxlength="500" placeholder="Write a message…" autocomplete="off" required disabled>
      <button id="sendButton" type="submit" disabled>Send</button>
    </form>
  </main>

  <script>
    // Use the same host as the webpage, so this works locally and on Render.
    const socketUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;
    const messages = document.querySelector("#messages");
    const emptyState = document.querySelector("#emptyState");
    const status = document.querySelector("#connectionStatus");
    const form = document.querySelector("#chatForm");
    const username = document.querySelector("#username");
    const messageInput = document.querySelector("#messageInput");
    const sendButton = document.querySelector("#sendButton");
    let socket;
    let reconnectTimer;

    function setConnectionState(connected, label) {
      status.textContent = label;
      status.classList.toggle("online", connected);
      messageInput.disabled = !connected;
      sendButton.disabled = !connected;
    }

    function addMessage(message) {
      emptyState.hidden = true;
      const item = document.createElement("article");
      item.className = `message${message.username === username.value.trim() ? " mine" : ""}`;

      const meta = document.createElement("div");
      meta.className = "message-meta";
      meta.textContent = `${message.username || "Anonymous"} · ${message.time || "now"}`;

      const text = document.createElement("div");
      text.className = "message-text";
      text.textContent = message.text || "";

      item.append(meta, text);
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function connect() {
      setConnectionState(false, "Connecting…");
      socket = new WebSocket(socketUrl);

      socket.addEventListener("open", () => setConnectionState(true, "Connected"));

      socket.addEventListener("message", (event) => {
        try {
          const data = JSON.parse(event.data);
          addMessage(data);
        } catch {
          addMessage({ username: "Server", text: event.data, time: "now" });
        }
      });

      socket.addEventListener("close", () => {
        setConnectionState(false, "Reconnecting…");
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 2500);
      });

      socket.addEventListener("error", () => socket.close());
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = username.value.trim();
      const text = messageInput.value.trim();
      if (!name || !text || !socket || socket.readyState !== WebSocket.OPEN) return;

      socket.send(JSON.stringify({ username: name, text }));
      messageInput.value = "";
      messageInput.focus();
    });

    connect();
  </script>
</body>
</html>
